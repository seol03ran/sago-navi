function downscale(img,max){const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;const r=Math.min(1,max/Math.max(w,h));const c=document.createElement("canvas");c.width=Math.round(w*r);c.height=Math.round(h*r);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c}
function quality(c){
  const w=480,h=Math.max(1,Math.round(c.height*480/c.width));const t=document.createElement("canvas");t.width=w;t.height=h;const g=t.getContext("2d");g.drawImage(c,0,0,w,h);
  const d=g.getImageData(0,0,w,h).data;const gr=new Float32Array(w*h);let sum=0;
  for(let i=0;i<w*h;i++){const v=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];gr[i]=v;sum+=v}

  return {bright:sum/(w*h),sharp:ls2/n-(ls/n)**2};

function localTriage(t){
  const has=(...w)=>w.some(x=>t.includes(x));
  const r={injured:"unknown",place:"unknown",type:"unknown",role:"unknown",summary:"",first:""};
  if(has("안 다쳤","다친 사람 없","다친 사람은 없","멀쩡"))r.injured="no";else if(has("다쳤","피가","피 나","아파","의식","쓰러"))r.injured="yes";
  if(has("고속도로","자동차전용","톨게이트","휴게소"))r.place="highway";else if(has("주차","골목","아파트","단지"))r.place="parking";else if(has("도로","교차로","신호","횡단보도","사거리"))r.place="road";
  if(has("보행자","사람을","사람이랑","자전거","킥보드"))r.type="person";else if(has("주차된","세워진","세워 둔","차 주인"))r.type="parked";else if(has("가드레일","전봇대","혼자","포트홀","벽에"))r.type="single";else if(has("차","박았","받았","추돌"))r.type="car";
  if(has("뒤차가","받혔","박혔","저를 박"))r.role="gothit";else if(has("제가 박","내가 박","들이받","앞차를"))r.role="hit";
  r.summary="말씀하신 단어로 골랐어요";r.first=r.injured!=="no"?"다친 사람이 있으면 119에 먼저 전화하세요.":r.place==="highway"?"가드레일 밖으로 대피하세요.":"비상등을 켜고 안전을 확인하세요.";
  return r;
}

  <div class="list">${o('data-type="car"',"car","차와 차","상대 차량과 부딪혔어요")}${o('data-type="person"',"walk","차와 사람","보행자·자전거·킥보드")}${o('data-type="single"',"wall","혼자 사고","시설물·가드레일·포트홀")}${o('data-type="parked"',"park","주차된 차나 물건","상대 운전자가 없어요")}</div>`;
R.role=()=>`
  <h1>누가 부딪혔나요?</h1><p class="lead">잘 모르면 그대로 골라도 괜찮아요. 과실은 나중에 정해져요.</p>
  <div class="list">${o('data-role="hit"',"hit","내가 부딪혔어요")}${o('data-role="gothit"',"gothit","내가 받혔어요")}${o('data-role="unknown"',"both","잘 모르겠어요","둘 다 움직이고 있었어요")}</div>`;
R.actions=()=>{
  const A=buildActions();const i=Math.min(S.ai,A.length-1);const a=A[i];
  return `<p class="pre ${a.kind}">${PRE[a.kind]}</p>
  <h1>${a.title}</h1>
  <p class="desc">${a.desc}</p>
  <div class="grow"></div>
  <div class="why"><span class="h">왜 그래야 하나요</span>${a.law}</div>
  <div class="btns"><button class="btn" data-a="actDone">했어요</button><button class="btn sub" data-a="actSkip">${i===A.length-1?"사진 남기러 가기":"나중에 할게요"}</button></div>`;
};
R.photos=()=>{
  const L=buildShots();const i=Math.min(S.pi,L.length-1);const s=L[i];const p=S.photos[s.id];
  const last=i===L.length-1;
  const lab={ok:"좋아요",warn:"한 번 확인해 주세요",retry:"다시 찍어 주세요"};
  const nextLabel=last?"다음":"다음 사진";
  let body,btns;
  if(S.busy===s.id){
    body=`<div class="cam" style="cursor:default"><span class="spin" style="width:30px;height:30px;border-width:3px"></span>사진을 보고 있어요</div>`;btns="";
  } else if(p){
    const g=p.gpt&&typeof p.gpt==="object"?p.gpt:null;
    const text=g?esc(g.message):p.msg.join(" ");
    const by=g?"GPT-6 Luna 판독":p.gpt==="busy"?'<span class="spin" style="width:12px;height:12px"></span>GPT가 한 번 더 보는 중':"휴대폰 AI 판독";
    body=`<div class="prev" data-zoom="${s.id}"><img src="${p.url}" alt="사진 분석 결과"></div>
    <div class="res ${p.status}"><div class="rh"><span class="dot"></span><b>${lab[p.status]}</b><span class="by" style="margin-left:auto">${by}</span></div>${text}<div class="meta">${g&&g.seen?esc(g.seen)+" · ":""}인식: ${p.tags.join(", ")||"없음"}</div></div>`;
    btns=p.status==="retry"
      ?`<label class="btn red">다시 찍기<input type="file" accept="image/*" capture="environment" data-shot="${s.id}"></label><button class="btn sub" data-a="shotNext">그래도 ${nextLabel}</button>`
      :`<button class="btn" data-a="shotNext">${nextLabel}</button><label class="btn sub">다시 찍기<input type="file" accept="image/*" capture="environment" data-shot="${s.id}"></label>`;
  } else {
    body=`<label class="cam">${ic("cam")}사진 찍기<small>찍으면 AI가 바로 확인해요</small><input type="file" accept="image/*" capture="environment" data-shot="${s.id}"></label>`;
    btns=`<div class="two"><label class="btn sub">앨범에서 고르기<input type="file" accept="image/*" data-shot="${s.id}"></label><button class="btn sub" data-a="shotNext">${s.opt?"없어요":"건너뛰기"}</button></div>`;
  }
  return `${s.isExtra?'<p class="pre tip">AI가 한 장 더 요청했어요</p>':s.opt?'<p class="pre warn">있다면 찍어 주세요</p>':""}<h1>${s.t}</h1><p class="lead">${S.place==="highway"?'<b style="color:var(--red)">가드레일 밖 안전한 곳에서만</b> ':""}${s.d}</p>
  ${body}
  <div class="btns">${btns}</div>`;
};
const fcls=k=>S.filled.has(k)?' class="filled"':"";
R.info=()=>`
  <div class="hl"><h1>${S.type==="single"?"메모를 남겨 두세요":"상대방 정보를<br>적어 두세요"}</h1>${S.type!=="single"?`<button class="btn lt" data-a="dictate" style="width:auto;min-height:40px;font-size:14.5px;padding:0 12px;flex:none;margin-top:2px">${ic("mic")}받아 적기</button>`:""}</div>
  ${S.type!=="single"?`<div class="fields">
    <div class="field"><label>${S.type==="parked"?"차 주인 이름":"이름"}</label><input data-o="name"${fcls("name")} value="${esc(S.other.name)}" autocomplete="off"></div>
    <div class="field"><label>연락처</label><input data-o="phone"${fcls("phone")} inputmode="tel" value="${esc(S.other.phone)}" autocomplete="off"></div>
    <div class="field"><label>차량번호</label><input data-o="plate"${fcls("plate")} value="${esc(S.other.plate)}" placeholder="12가3456" autocomplete="off"></div>
    <div class="field"><label>보험사</label><input data-o="insurer"${fcls("insurer")} value="${esc(S.other.insurer)}" autocomplete="off"></div></div>`:""}
  <div class="field" style="margin-top:10px"><label>메모 (목격자, CCTV, 상황)</label><input id="memo" value="${esc(S.memo)}" autocomplete="off"></div>
  <div class="locline">${S.started?fmt(S.started):"-"} · <span id="locTxt">${locText()}</span><button class="relocate" data-a="loc">다시 찾기</button></div>
  ${S.filled.size?'<p class="small" style="margin-top:6px">파란 칸은 AI가 채웠어요. 상대에게 맞는지 확인해 주세요.</p>':""}
  <div class="grow"></div>
  <div class="btns"><button class="btn" data-go="wait">다음</button></div>`;
function policeNote(){
  if(S.injured!=="no")return {c:"red",t:"경찰 신고는 의무예요",d:"사람이 다친 사고예요. 신고하지 않고 떠나면 처벌받을 수 있어요(도로교통법 제54조 제2항)."};
  if(S.type==="parked")return {c:"",t:"연락처를 남겼다면 신고 의무는 없어요",d:"불안하면 112에 알려 두면 기록이 남아요."};
  return {c:"",t:"물건만 부서졌다면 신고 의무는 없어요",d:"말이 바뀔 것 같거나 음주가 의심되면 112를 부르세요(도로교통법 제54조 제2항 단서)."};
}
R.wait=()=>{
  const n=policeNote();const inj=S.injured!=="no";
  return `<h1>보험사가 올 때까지<br>이렇게 기다리세요</h1>
  <div class="calls">
    <a class="call b" href="${insHref()}">${esc(my.insurer)||"내 보험사"}<small>${my.phone?esc(my.phone):"번호 저장하기"}</small></a>
    <a class="call r" href="tel:112">112<small>경찰</small></a>
    <a class="call r" href="tel:119">119<small>구급</small></a>
    <a class="call" href="tel:15882504">도로공사<small>1588-2504</small></a></div>
  <div class="callout ${n.c}"><b>${n.t}</b>${n.d}</div>
  <ul class="plain"><li>차도 밖 안전한 곳에서 기다리세요</li><li>아프면 오늘 진료받으세요. 기록이 있어야 보상받기 쉬워요</li><li>현장 합의나 각서 서명은 하지 마세요</li></ul>
  <div class="grow"></div>
  <div class="btns">${inj&&S.type!=="parked"?`<div class="two"><button class="btn sub" data-a="f12">형사처벌 확인</button><button class="btn" data-go="report">사고 기록 보기</button></div>`:`<button class="btn" data-go="report">사고 기록 보기</button>`}</div>`;
};
R.report=()=>{
  const A=buildActions();const ph=buildShots().filter(s=>S.photos[s.id]);
  const RO={hit:" · 내가 부딪힘",gothit:" · 내가 받힘",unknown:""}[S.role]||"";
  const dn=A.filter(a=>S.done.has(a.id)).length;const miss=A.filter(a=>a.kind==="duty"&&!S.done.has(a.id)).length;
  return `<h1>사고 기록</h1>
  <div class="kv">
    <div><span>언제</span><span class="v">${S.started?fmt(S.started):"-"}<br>${locText()}</span></div>
    <div><span>사고</span><span class="v">${PNAME[S.place]||"-"} · ${TNAME[S.type]||"-"}${RO} · 부상자 ${INAME[S.injured]||"-"}</span></div>
    ${S.type!=="single"?`<div><span>상대</span><span class="v">${esc([S.other.name,S.other.phone,S.other.plate,S.other.insurer].filter(Boolean).join(" · "))||"적지 않음"}</span></div>`:""}
    <div><span>한 일</span><span class="v">${dn}/${A.length}개${miss?` · <b style="color:var(--red)">법적 의무 ${miss}개를 확인해 주세요</b>`:""}</span></div>
    ${S.memo?`<div><span>메모</span><span class="v">${esc(S.memo)}</span></div>`:""}
  </div>
  <div class="thumbs">${ph.map(s=>`<img src="${S.photos[s.id].url}" data-zoom="${s.id}" alt="${s.t}">`).join("")}</div>
  <div class="grow"></div>
  <div class="btns"><button class="btn" data-a="doc">AI로 경위서 쓰기</button>
  <div class="tiles"><button data-a="share">${ic("share")}공유</button><button data-a="print">${ic("print")}PDF</button><button data-a="next3">${ic("list")}앞으로</button><button data-a="reset">${ic("redo")}처음으로</button></div></div>`;
};

/* ---------- 시트 ---------- */
function openSheet(html){const el=$("#sheet");el.innerHTML=`<div class="sheet">${html}</div>`;el.hidden=false}
function closeSheet(){if(rec)rec.stop();const el=$("#sheet");el.hidden=true;el.innerHTML=""}
function sheetIns(){openSheet(`<h2>내 보험사 번호</h2><p class="lead">보험증권이나 보험사 앱에 있는 사고 접수 번호를 저장해 두세요. 이 휴대폰에만 저장돼요.</p>
  <div class="fields"><div class="field"><label>보험사</label><input id="myIns" value="${esc(my.insurer)}" placeholder="예: ○○화재"></div><div class="field"><label>번호</label><input id="myPhone" inputmode="tel" value="${esc(my.phone)}" placeholder="예: 1588-0000"></div></div>
  <button class="btn" data-a="saveIns">저장</button>`)}
function sheetF12(){openSheet(`<h2>형사처벌 대상인지 확인</h2>
  <p class="lead">사람이 다친 사고도 종합보험에 가입돼 있으면 원칙적으로 공소가 제기되지 않아요(교통사고처리특례법 제4조). 다만 아래 12가지에 해당하거나, 피해자가 중상해를 입었거나, 도주했다면 예외예요.</p>
  <div>${FAULT12.map((f,i)=>`<label class="chk"><input type="checkbox" data-f12="${i}" ${S.fault12.has(i)?"checked":""}>${f}</label>`).join("")}</div>
  <div id="f12res"></div><button class="btn sub" data-a="close">닫기</button>`);f12()}
function f12(){const el=$("#f12res");if(!el)return;el.innerHTML=S.fault12.size?`<div class="callout red" style="margin:0"><b>보험과 별개로 형사처벌될 수 있어요</b>진술은 사실대로 하고, 조사 전에 대한법률구조공단(132)이나 변호사와 상담하세요. 피해자와 합의하면 양형에 반영될 수 있어요.</div>`:`<div class="callout" style="margin:0"><b>해당하는 게 없다면</b>종합보험에 가입돼 있고 피해자가 중상해가 아니면 공소가 제기되지 않아요(교통사고처리특례법 제4조 제1항).</div>`}
function sheetNext3(){openSheet(`<h2>앞으로 할 일</h2>
  <div class="kv box">
  <div><span>보험</span><span class="v">접수번호를 받아 두세요. 과실비율은 손해보험협회 기준에 따라 정해지고, 보험사끼리 다투면 구상금분쟁심의위원회가 심의해요.</span></div>
  ${S.injured!=="no"?`<div><span>형사</span><span class="v">사람이 다친 사고는 경찰 조사를 받아요. 종합보험 가입과 12대 중과실 해당 여부에 따라 처벌이 갈려요(교통사고처리특례법 제3조·제4조). 무료 상담 132.</span></div>
  <div><span>면허</span><span class="v">피해 정도에 따라 운전면허 벌점이 매겨질 수 있어요.</span></div>`:""}
  ${S.type==="single"?`<div><span>도로</span><span class="v">도로 관리 잘못이 원인이면 도로관리청에 배상을 청구할 수 있어요(국가배상법 제5조).</span></div>`:""}
  <div><span>진료</span><span class="v">아프면 바로 진료받고 진단서·영수증을 모아 두세요.</span></div></div>
  <button class="btn sub" data-a="close">닫기</button>`)}

/* ---------- 공통 ---------- */
function render(){
  view.innerHTML=R[S.screen]();view.scrollTop=0;
  const g=GROUP[S.screen];
  let title="사고내비",sub="";
  if(S.screen==="actions"){const A=buildActions();title=`지금 할 일 ${Math.min(S.ai,A.length-1)+1}/${A.length}`}
  else if(S.screen==="photos"){const L=buildShots();title=`사진 ${Math.min(S.pi,L.length-1)+1}/${L.length}`}
  else if(g!=null)title=GNAME[g];
  $("#ttl").classList.toggle("logo",g==null);$("#ttlB").textContent=title;
  $("#bar").hidden=g==null;if(g!=null)$("#barI").style.width=((g+1)/7*100)+"%";
  $("#back").hidden=!S.hist.length||S.screen==="home";
  $("#ttlS").hidden=!S.started||g==null;tick();
  $("#dockIns").href=insHref();$("#dockIns").textContent=my.insurer||"내 보험사";
  if(S.screen==="photos")loadModel();
}
function insHref(){return my.phone?"tel:"+my.phone.replace(/[^0-9+]/g,""):"#"}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmt(d){return new Date(d).toLocaleString("ko-KR",{month:"long",day:"numeric",weekday:"short",hour:"2-digit",minute:"2-digit"})}
function locText(){if(S.loc)return `${S.loc.lat.toFixed(5)}, ${S.loc.lng.toFixed(5)} · <a href="https://map.kakao.com/link/map/사고위치,${S.loc.lat},${S.loc.lng}" target="_blank" rel="noopener">지도</a>`;return S.locErr?"위치를 기록하지 못했어요":"위치를 찾는 중"}
function getLoc(cb){if(!navigator.geolocation){S.locErr=true;return}navigator.geolocation.getCurrentPosition(p=>{S.loc={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};S.locErr=false;const t=$("#locTxt");if(t)t.innerHTML=locText();cb&&cb()},()=>{S.locErr=true;const t=$("#locTxt");if(t)t.innerHTML=locText()},{enableHighAccuracy:true,timeout:10000})}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2600)}
function tick(){if(!S.started)return;const s=Math.floor((Date.now()-S.started)/1000);$("#ttlS").textContent=`사고 후 ${Math.floor(s/60)}분 ${String(s%60).padStart(2,"0")}초`}
setInterval(tick,1000);
function reportText(){
  return `[사고 기록]\n시각: ${S.started?fmt(S.started):"-"}\n위치: ${S.loc?`https://map.kakao.com/link/map/사고위치,${S.loc.lat},${S.loc.lng}`:"미기록"}\n유형: ${TNAME[S.type]||"-"}\n부상자: ${INAME[S.injured]||"-"}\n상대방: ${[S.other.name,S.other.phone,S.other.plate,S.other.insurer].filter(Boolean).join(" / ")||"미기록"}\n사진: ${buildShots().filter(s=>S.photos[s.id]).map(s=>s.t).join(", ")||"없음"}\n메모: ${S.memo||"-"}`;
}
function start(demo){S.started=Date.now();S.demo=demo;S.auto=false;S.hist=[];loadModel();getLoc();if(demo)toast("체험 모드예요. 아무 차 사진으로 AI 판독을 써 보세요");go("injured")}
function shareText(txt,title){if(navigator.share)navigator.share({title,text:txt}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast("복사했어요"))}

/* ---------- 이벤트 ---------- */
$("#back").addEventListener("click",back);
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("#lb")){$("#lb").hidden=true;return}
  const z=t.closest("[data-zoom]");if(z&&S.photos[z.dataset.zoom]){$("#lbImg").src=S.photos[z.dataset.zoom].url;$("#lb").hidden=false;return}
  if(t.id==="sheet"){closeSheet();return}
  if(t.closest('a[href="#"]')){e.preventDefault();sheetIns();return}
  let el;
  if(el=t.closest("[data-mic]")){micToggle(el,$("#"+el.dataset.mic));return}
  if(el=t.closest("[data-fill]")){$("#"+el.dataset.fill).value=el.textContent;return}
  if(el=t.closest("[data-askq]")){askGo(el.dataset.askq);return}
  if(el=t.closest("[data-inj]")){S.injured=el.dataset.inj;go(nextScreen("injured"));return}
  if(el=t.closest("[data-place]")){S.place=el.dataset.place;go(nextScreen("place"));return}
  if(el=t.closest("[data-type]")){S.type=el.dataset.type;S.role=null;S.extra=[];S.pi=0;S.ai=0;go(nextScreen("type"));return}
  if(el=t.closest("[data-role]")){S.role=el.dataset.role;S.ai=0;go("actions");return}
  if(el=t.closest("[data-go]")){go(el.dataset.go);return}
  if(!(el=t.closest("[data-a]")))return;
  const A=buildActions();
  switch(el.dataset.a){
    case "start":start(false);break;
    case "demo":start(true);break;
    case "talk":sheetTalk();break;
    case "talkGo":talkGo();break;
    case "talkStart":talkStart();break;
    case "ask":sheetAsk();break;
    case "askGo":askGo();break;
    case "dictate":sheetDictate();break;
    case "dicGo":dicGo();break;
    case "doc":sheetDoc();break;
    case "docCopy":if(S._doc&&navigator.clipboard)navigator.clipboard.writeText(S._doc.statement).then(()=>toast("경위서를 복사했어요"));break;
    case "smsShare":if(S._doc)shareText(S._doc.sms,"사고 접수");break;
    case "next":go(nextScreen(S.screen));break;
    case "insSheet":sheetIns();break;
    case "close":closeSheet();break;
    case "saveIns":my={insurer:$("#myIns").value.trim(),phone:$("#myPhone").value.trim()};store.set("sagonavi_my",my);closeSheet();toast("저장했어요");render();break;
    case "actDone":S.done.add(A[Math.min(S.ai,A.length-1)].id);/* falls through */
    case "actSkip":if(S.ai<A.length-1){S.hist.push({screen:"actions",ai:S.ai,pi:S.pi});S.ai++;render()}else{S.pi=0;go("photos")}break;
    case "shotNext":{const L=buildShots();if(S.pi<L.length-1){S.hist.push({screen:"photos",ai:S.ai,pi:S.pi});S.pi++;render()}else go("info");break}
    case "loc":toast("위치를 찾고 있어요");getLoc(()=>toast("위치를 기록했어요"));break;
    case "f12":sheetF12();break;
    case "next3":sheetNext3();break;
    case "share":shareText(reportText(),"사고 기록");break;
    case "print":window.print();break;
    case "reset":if(confirm("사고 기록을 모두 지울까요?")){Object.assign(S,{screen:"home",hist:[],started:null,injured:null,place:null,type:null,role:null,ai:0,pi:0,done:new Set(),photos:{},extra:[],other:{name:"",phone:"",plate:"",insurer:""},memo:"",loc:null,locErr:false,fault12:new Set(),auto:false,aiSummary:"",qa:[],filled:new Set()});render()}break;
  }
});
document.addEventListener("input",e=>{if(e.target.dataset.o){S.other[e.target.dataset.o]=e.target.value;S.filled.delete(e.target.dataset.o);e.target.classList.remove("filled")}if(e.target.id==="memo")S.memo=e.target.value});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="askTxt"&&!e.shiftKey){e.preventDefault();askGo()}});
document.addEventListener("change",async e=>{
  if(e.target.dataset.f12!=null){const i=+e.target.dataset.f12;e.target.checked?S.fault12.add(i):S.fault12.delete(i);f12();return}
  const id=e.target.dataset.shot;if(!id||!e.target.files||!e.target.files[0])return;
  const file=e.target.files[0];const shot=buildShots().find(s=>s.id===id);
  S.busy=id;render();
  let n=0;while(modelState==="loading"&&n++<150)await new Promise(r=>setTimeout(r,100));
  let p=null;try{p=await analyze(shot,file);S.photos[id]=p}catch(err){toast("사진을 읽지 못했어요. 다시 시도해 주세요")}
  S.busy=null;render();
  if(p)gptPhoto(shot,p);
});
window.__SN={S,buildActions,buildShots,analyze,render,go,gpt,gptPhoto,get modelState(){return modelState},get gptState(){return gptState},loadModel,sheetTalk,sheetAsk,sheetDoc,sheetDictate};
gptPing();
render();
})();
