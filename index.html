<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사고내비 · 교통사고 현장 길잡이</title>
<meta name="description" content="교통사고가 나면 앱을 켜세요. 상황을 고르면 지금 해야 할 일을 한 화면에 하나씩 알려주고, AI가 사진을 확인해 부족하면 다시 찍도록 안내합니다.">
<meta property="og:title" content="사고내비 · 교통사고 현장 길잡이">
<meta property="og:description" content="사고 직후, 지금 할 일을 하나씩. AI 사진 코치와 법적 의무 안내.">

<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f3f5f8; --card:#fff; --ink:#111b26; --sub:#5d6b7a; --line:#e1e6ec;
  --navy:#0e1b2c; --blue:#2563eb; --blue-soft:#e8efff;
  --red:#e5383b; --red-soft:#fdeceb; --amber:#d97706; --amber-soft:#fff5e0;
  --green:#16a34a; --green-soft:#e7f7ed;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input{font:inherit;color:inherit}
.app{height:100vh;height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
header{flex:none;background:var(--navy);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.hrow{display:flex;align-items:center;gap:8px;height:34px}
.back{flex:none;width:34px;height:34px;border:none;border-radius:10px;background:rgba(255,255,255,.12);color:#fff;font-size:22px;line-height:1;cursor:pointer}
.logo{display:flex;align-items:center;gap:7px;font-weight:800;font-size:17px}
.timer{margin-left:auto;font-variant-numeric:tabular-nums;font-size:12.5px;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:999px}
.bars{display:flex;gap:3px;margin-top:8px}
.bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.18)}
.bars i.on{background:#60a5fa}.bars i.done{background:#34d399}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:14px 16px 12px;overflow-y:auto}
.grow{flex:1;min-height:0}
.eyebrow{font-size:13px;font-weight:800;color:var(--blue);display:flex;justify-content:space-between;align-items:center;flex:none}
h1{font-size:clamp(21px,3.4dvh,26px);line-height:1.3;margin:0;letter-spacing:-.6px;flex:none}
.lead{color:var(--sub);margin:0;line-height:1.5;font-size:15px;flex:none}
.opts{display:flex;flex-direction:column;gap:9px;flex:1;min-height:0;justify-content:center}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:0 16px;font-size:18px;font-weight:800;cursor:pointer;min-height:clamp(58px,10.5dvh,84px)}
.opt .em{font-size:28px;flex:none;width:36px;text-align:center}
.opt small{display:block;font-weight:500;font-size:13.5px;color:var(--sub);margin-top:2px}
.opt:active{border-color:var(--blue);background:var(--blue-soft)}
.opt.red{border-color:#f6b9b6}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:none;border-radius:16px;background:var(--blue);color:#fff;font-weight:800;font-size:18px;min-height:56px;padding:0 14px;cursor:pointer;text-decoration:none;text-align:center}
.btn.red{background:var(--red)}.btn.navy{background:var(--navy)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-size:16px;min-height:48px;font-weight:700}
.btn.link{background:none;color:var(--sub);font-size:14.5px;font-weight:600;min-height:36px;text-decoration:underline}
.btns{display:flex;flex-direction:column;gap:8px;flex:none}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.sos{flex:1;min-height:150px;max-height:min(360px,44dvh);border:none;border-radius:26px;background:var(--red);color:#fff;font-size:clamp(26px,4.4dvh,34px);font-weight:900;cursor:pointer;box-shadow:0 12px 30px rgba(229,56,59,.35);letter-spacing:-.6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.sos small{font-size:14.5px;font-weight:600;opacity:.9}
.mini{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:14.5px;cursor:pointer;width:100%;text-align:left;flex:none}
.mini b{margin-left:auto;color:var(--blue);font-size:14px;flex:none}
.muted{color:var(--sub);font-size:12.5px;line-height:1.5;margin:0;flex:none}
.task{flex:1;min-height:0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.tag{align-self:flex-start;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px}
.tag.duty{background:var(--red-soft);color:var(--red)}.tag.safety{background:var(--amber-soft);color:var(--amber)}
.tag.tip{background:var(--blue-soft);color:var(--blue)}.tag.warn{background:#eef1f4;color:#475569}
.task h2{font-size:clamp(21px,3.8dvh,28px);line-height:1.32;margin:0;letter-spacing:-.5px}
.task p{margin:0;font-size:clamp(15px,2.6dvh,17.5px);line-height:1.55;color:#2b3a4a}
.task .mid{margin:auto 0;display:flex;flex-direction:column;gap:10px}
.law{font-size:13px;line-height:1.5;color:#3b4b5c;background:#f1f4f8;border-radius:12px;padding:10px 12px}
.law b{color:var(--ink)}
.dots{display:flex;gap:4px;align-items:center}.dots i{width:7px;height:7px;border-radius:50%;background:#cfd6de}.dots i.d{background:var(--green)}.dots i.c{background:var(--blue);width:18px;border-radius:4px}
.steps4{flex:1;display:flex;flex-direction:column;gap:8px;justify-content:center;min-height:0}
.s4{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #f6b9b6;border-radius:16px;padding:6px 16px;min-height:clamp(54px,9dvh,72px);font-size:18px;font-weight:800}
.s4 .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:16px}
.s4 small{display:block;font-size:13px;font-weight:500;color:var(--sub)}
.bigalert{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;background:var(--red-soft);border:1px solid #f6b9b6;border-radius:22px;padding:20px}
.bigalert .ic{font-size:56px;line-height:1}
.bigalert h2{margin:0;font-size:24px;letter-spacing:-.5px}
.bigalert p{margin:0;font-size:16px;line-height:1.55;color:#3b2424}
.shot{flex:1;min-height:0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.shot.extra{border:2px dashed #93b4ff}
.shead{display:flex;gap:12px;align-items:center;flex:none}
.shead .ic{flex:none;width:48px;height:48px;border-radius:14px;background:#eef2f7;display:grid;place-items:center;font-size:24px}
.shead h2{font-size:19px;margin:0;line-height:1.3;letter-spacing:-.4px}
.shead p{margin:2px 0 0;font-size:14px;color:var(--sub);line-height:1.4}
.cam{flex:1;min-height:110px;border:2px dashed #b9c6d4;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;background:#f8fafc;font-weight:800;font-size:19px;color:var(--navy);text-align:center;padding:10px}
.cam .big{font-size:44px;line-height:1}
.cam small{font-weight:500;font-size:13px;color:var(--sub)}
input[type=file]{display:none}
.prev{flex:1;min-height:90px;position:relative;border-radius:14px;overflow:hidden;background:#0b1320;cursor:zoom-in}
.prev img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.verdict{border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.45;flex:none}
.verdict.ok{background:var(--green-soft)}.verdict.warn{background:var(--amber-soft)}.verdict.retry{background:var(--red-soft)}
.verdict b{display:block;font-size:15.5px;margin-bottom:2px}
.verdict .tags{font-size:12px;color:#475569;margin-top:4px}
.ailine{font-size:12px;color:var(--sub);flex:none;min-height:16px}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid #cbd5e1;border-top-color:var(--blue);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.field{flex:none}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:4px}
.field input{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.locline{font-size:13.5px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;line-height:1.5;flex:none}
.calls{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.call{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-decoration:none;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:16px;min-height:clamp(60px,9.5dvh,80px);font-weight:800;font-size:17px;text-align:center;cursor:pointer}
.call small{font-weight:500;font-size:12px;color:var(--sub)}
.call.r{background:var(--red);color:#fff;border-color:var(--red)}.call.r small{color:#ffe3e3}
.call.n{background:var(--navy);color:#fff;border-color:var(--navy)}.call.n small{color:#cbd5e1}
.note{border-radius:14px;padding:11px 13px;font-size:14.5px;line-height:1.5;flex:none}
.note b{display:block;font-size:15.5px;margin-bottom:2px}
.note.red{background:var(--red-soft)}.note.blue{background:var(--blue-soft)}.note.amber{background:var(--amber-soft)}.note.green{background:var(--green-soft)}.note.gray{background:#eef1f4}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;flex:none}
.list li{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14.5px;line-height:1.4;display:flex;gap:8px}
.list li span{flex:none}
.rep{background:#fff;border:1px solid var(--line);border-radius:16px;padding:2px 14px;flex:none}
.rep div{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #eef1f4;font-size:14px;line-height:1.4}
.rep div:last-child{border:none}
.rep span{flex:none;width:40px;color:var(--sub)}
.thumbs{display:flex;gap:6px;overflow-x:auto;flex:none}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:10px;flex:none;cursor:zoom-in}
.dock{flex:none;background:#fff;border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:8px}
.dock a{display:flex;align-items:center;justify-content:center;gap:5px;text-decoration:none;font-weight:800;border-radius:13px;min-height:46px;font-size:15px;white-space:nowrap;overflow:hidden}
.dock .d1{background:var(--red);color:#fff}.dock .d2{background:var(--navy);color:#fff}.dock .d3{background:var(--blue-soft);color:var(--blue)}
.sheetbg{position:fixed;inset:0;z-index:50;background:rgba(10,18,30,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:90dvh;overflow-y:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.sheet h2{margin:0;font-size:20px}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;padding:6px 2px;border-bottom:1px solid #f0f2f5}
.chk input{width:20px;height:20px;accent-color:var(--red);flex:none}
.lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:8px;color:#fff;font-size:13px}
.lb img{max-width:100%;max-height:85dvh;border-radius:12px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:70;max-width:90%;text-align:center}
.toast.on{opacity:1}
@media (max-height:690px){main{padding-top:10px;gap:8px}.task{padding:14px;gap:8px}.task p{font-size:15px}.law{font-size:12.5px}.btn{min-height:50px}.btn.ghost{min-height:44px}.dock a{min-height:42px}.list li{padding:7px 10px;font-size:14px}.rep div{padding:6px 0}.thumbs img{width:56px;height:56px}.note{padding:9px 12px;font-size:14px}}
.relocate{border:1px solid var(--line);background:#f8fafc;border-radius:8px;font-size:12px;padding:2px 8px;margin-left:4px;cursor:pointer}
@media (max-height:600px){main{gap:6px;padding:8px 14px 8px}.eyebrow.hs{display:none}h1{font-size:19px}.lead{font-size:14px}
 .field label{font-size:12px;margin-bottom:2px}.field input{padding:8px 10px;font-size:15px}.locline{padding:7px 10px;font-size:12.5px}
 .call{min-height:50px;font-size:15.5px}.note{padding:7px 10px;font-size:13px}.note b{font-size:14px}.list{gap:4px}.list li{padding:6px 10px;font-size:13px}
 .rep div{padding:5px 0;font-size:13px}.thumbs img{width:48px;height:48px}.btn{min-height:46px;font-size:16.5px}.btn.ghost{min-height:42px;font-size:15px}
 .opt{font-size:17px}.task h2{font-size:20px}.task p{font-size:14.5px}.law{font-size:12px;padding:8px 10px}.dock{padding-top:6px}.dock a{min-height:40px}
 .sos{min-height:120px}.bigalert{padding:12px;gap:6px}.bigalert .ic{font-size:40px}.s4{min-height:46px;font-size:16px}.verdict{font-size:13.5px;padding:8px 10px}}
@media print{header,.dock,.btns{display:none!important}html,body{overflow:visible;height:auto}.app{height:auto}main{overflow:visible}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hrow">
      <button class="back" id="back" aria-label="이전" hidden>‹</button>
      <div class="logo"><svg width="24" height="24" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="12" fill="#e5383b"/><path d="M13 5 19 18H7Z" fill="#fff"/><rect x="12" y="10" width="2" height="4.5" rx="1" fill="#e5383b"/><circle cx="13" cy="16.2" r="1.1" fill="#e5383b"/></svg>사고내비</div>
      <div class="timer" id="timer" hidden></div>
    </div>
    <div class="bars" id="bars" hidden></div>
  </header>
  <main id="view"></main>
  <nav class="dock">
    <a class="d1" href="tel:119">🚑 119</a>
    <a class="d2" href="tel:112">🚓 112</a>
    <a class="d3" id="dockIns" href="#">📞 내 보험사</a>
  </nav>
</div>
<div id="sheet" class="sheetbg" hidden></div>
<div id="lb" class="lb" hidden><img id="lbImg" alt=""><div>AI가 찾은 물체를 상자로 표시했어요 · 눌러서 닫기</div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js" defer></script>
<script>
(function(){
"use strict";
const $=s=>document.querySelector(s);
const view=$("#view");
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let my=store.get("sagonavi_my",{insurer:"",phone:""});

const S={screen:"home",hist:[],started:null,injured:null,place:null,type:null,role:null,
  ai:0,pi:0,done:new Set(),photos:{},extra:[],busy:null,
  other:{name:"",phone:"",plate:"",insurer:""},memo:"",loc:null,locErr:false,fault12:new Set(),demo:false};

const GROUP={injured:0,call119:0,place:0,bitbox:0,type:1,role:1,actions:2,photos:3,info:4,wait:5,report:6};
const FAULT12=["신호·지시 위반","중앙선 침범","제한속도보다 20km/h 넘게 과속","앞지르기 방법·금지 위반","철길건널목 통과방법 위반","횡단보도 보행자 보호의무 위반","무면허 운전","음주·약물 운전","보도 침범·보도 횡단방법 위반","승객 추락방지의무 위반","어린이보호구역 안전운전의무 위반(어린이 상해)","화물 고정조치 위반(화물 낙하)"];
const TAG={duty:"법적 의무",safety:"안전",tip:"권장",warn:"주의"};

/* ---------- 할 일 (상황별) ---------- */
function buildActions(){
  const A=[],inj=S.injured!=="no",hw=S.place==="highway",t=S.type;
  const add=(id,kind,title,desc,law)=>A.push({id,kind,title,desc,law});
  if(inj) add("rescue","duty","다친 사람을 살피고 119에 신고","의식·호흡·출혈을 확인하세요. 목이나 허리를 다쳤을 수 있으면 함부로 옮기지 마세요.","<b>도로교통법 제54조 제1항</b> 사상자 구호 의무. 구호하지 않고 떠나면 <b>특정범죄가중처벌법 제5조의3(도주치상)</b>으로 처벌돼요.");
  if(hw) add("hwphoto","safety","사진은 대피한 뒤 안전할 때만","차로에 다시 들어가지 마세요. 위험하면 사진은 건너뛰고 경찰·보험사 출동에 맡기세요.","고속도로 2차 사고는 차 안이나 차 주변에 있던 사람에게 많이 일어나요(한국도로공사).");
  else if(S.place==="road") add("hazard","tip","비상등 켜고 뒤차에 알리기","안전하다면 트렁크를 열고 차 뒤쪽에 안전삼각대를 세우세요.","일반 도로에서는 권장 사항이에요. 고장자동차 표지 설치 의무는 고속도로·자동차전용도로에 적용돼요(<b>도로교통법 제66조</b>).");

/* ---------- AI ---------- */
let model=null,modelState="idle";
function loadModel(){
  if(model||modelState==="loading")return;modelState="loading";aiLine();
  const wait=()=>new Promise((res,rej)=>{let n=0;const t=setInterval(()=>{if(window.cocoSsd&&window.tf){clearInterval(t);res()}else if(++n>200){clearInterval(t);rej()}},100)});
  wait().then(()=>cocoSsd.load({base:"lite_mobilenet_v2"})).then(m=>{model=m;modelState="ready";aiLine()}).catch(()=>{modelState="fail";aiLine()});
}
function aiLine(){const el=$("#aiLine");if(el)el.innerHTML={idle:"",loading:'<span class="spin"></span> AI 준비 중…',ready:"🧠 AI가 사진을 확인해요 · 사진은 휴대폰 안에서만 분석",fail:"⚠️ AI를 불러오지 못했어요 · 흔들림·밝기만 검사해요"}[modelState]}
const VEH=["car","truck","bus","motorcycle"];
const KO={car:"승용차",truck:"트럭",bus:"버스",motorcycle:"오토바이",bicycle:"자전거",person:"사람","traffic light":"신호등","stop sign":"정지 표지판"};
function fileToImage(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f);const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u})}
function downscale(img,max){const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*r);c.height=Math.round(img.naturalHeight*r);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c}
function quality(c){
  const w=480,h=Math.max(1,Math.round(c.height*480/c.width));const t=document.createElement("canvas");t.width=w;t.height=h;const g=t.getContext("2d");g.drawImage(c,0,0,w,h);
  const d=g.getImageData(0,0,w,h).data;const gr=new Float32Array(w*h);let sum=0;
  for(let i=0;i<w*h;i++){const v=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];gr[i]=v;sum+=v}
  let ls=0,ls2=0,n=0;for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;const v=4*gr[i]-gr[i-1]-gr[i+1]-gr[i-w]-gr[i+w];ls+=v;ls2+=v*v;n++}
  return {bright:sum/(w*h),sharp:ls2/n-(ls/n)**2};
}
async function analyze(shot,file){
  const img=await fileToImage(file);const c=downscale(img,1024);const q=quality(c);let dets=[];
  if(model){try{dets=await model.detect(c,20,0.4)}catch(e){}}
  const A=c.width*c.height;
  const objs=dets.map(d=>({cls:d.class,score:d.score,box:d.bbox,area:d.bbox[2]*d.bbox[3]/A}));
  const veh=objs.filter(o=>VEH.includes(o.cls));const maxV=veh.reduce((m,o)=>Math.max(m,o.area),0);
  const sig=objs.filter(o=>o.cls==="traffic light"||o.cls==="stop sign");
  const ppl=objs.filter(o=>["person","bicycle","motorcycle"].includes(o.cls));
  let st="ok",msg=[];
  const warn=m=>{if(st==="ok")st="warn";msg.push(m)};
  if(q.sharp<60){st="retry";msg.push("사진이 흔들렸어요. 두 손으로 잡고 다시 찍어 주세요.")}
  if(q.bright<45)warn("너무 어두워요. 플래시를 켜고 한 장 더 찍어 두면 좋아요.");
  if(model&&st!=="retry"){
    const k=shot.kind;
    if(k==="wide2"||k==="wide1"){
      if(!veh.length){st="retry";msg.push("차가 보이지 않아요. 차가 화면 안에 들어오게 다시 찍어 주세요.")}
      else if(maxV>0.5){st="retry";msg.push("너무 가까워요. 3~5걸음 물러나서 차 전체와 차선이 나오게 찍어 주세요.")}
      else if(k==="wide2"&&veh.length<2){warn("차가 1대만 보여요. 상대 차도 나오게 다른 각도에서 1장 더 찍어 주세요.");addExtra(shot.parent||shot.id,{id:(shot.parent||shot.id)+"_b",ic:"📐",t:"두 차가 함께 나온 다른 각도",d:"옆이나 대각선에서 두 차가 다 나오게",kind:"wide2"})}
    } else if(k==="close"){ if(veh.length&&maxV<0.2)warn("파손 부위가 작게 나왔어요. 한두 걸음 다가가서 크게 찍어 주세요."); }
    else if(k==="signal"){ if(!sig.length)warn("신호등·표지판을 찾지 못했어요. 있다면 함께 나오게 다시 찍고, 없으면 넘어가도 돼요."); }
    else if(k==="person"){ if(!ppl.length&&!veh.length)warn("위치를 알 만한 표시가 잘 안 보여요. 차와 함께 나오게 찍어 주세요."); }
    else if(k==="plate"){ if(q.sharp<300)warn("번호 글자가 흐릴 수 있어요. 가까이에서 초점을 맞춰 한 장 더 찍어 주세요."); }
  }
  if(st==="ok")msg.unshift({wide2:"두 차의 위치가 잘 보여요.",wide1:"전체 상황이 잘 보여요.",close:"파손 부위가 잘 보여요.",plate:"번호판 글자가 읽히는지 한 번만 확인해 주세요.",signal:"신호·표지가 함께 찍혔어요.",person:"위치가 기록됐어요.",any:"기록됐어요."}[shot.kind]||"좋아요.");
  const out=document.createElement("canvas");out.width=c.width;out.height=c.height;const g=out.getContext("2d");g.drawImage(c,0,0);
  const fs=Math.max(16,c.width/30);g.lineWidth=Math.max(3,c.width/200);g.font=`bold ${fs}px sans-serif`;
  for(const o of objs){const col=VEH.includes(o.cls)?"#22c55e":o.cls==="person"?"#f59e0b":"#3b82f6";g.strokeStyle=col;g.strokeRect(o.box[0],o.box[1],o.box[2],o.box[3]);const lab=(KO[o.cls]||o.cls)+" "+Math.round(o.score*100)+"%";const tw=g.measureText(lab).width+10;const lh=fs+8;g.fillStyle=col;g.fillRect(o.box[0],Math.max(0,o.box[1]-lh),tw,lh);g.fillStyle="#fff";g.fillText(lab,o.box[0]+5,Math.max(fs,o.box[1]-6))}
  const cnt={};objs.forEach(o=>{const k=KO[o.cls]||o.cls;cnt[k]=(cnt[k]||0)+1});
  return {status:st,msg,tags:Object.entries(cnt).map(([k,v])=>k+" "+v),q,url:out.toDataURL("image/jpeg",.72)};
}
function addExtra(parent,e){if(S.extra.some(x=>x.id===e.id))return;S.extra.push(Object.assign({parent,opt:false,isExtra:true},e));toast("AI가 사진 1장을 더 요청했어요")}

/* ---------- 공통 ---------- */
function render(){
  view.innerHTML=R[S.screen]();view.scrollTop=0;
  const g=GROUP[S.screen];const bars=$("#bars");
  if(g==null)bars.hidden=true;else{bars.hidden=false;bars.innerHTML=[0,1,2,3,4,5,6].map(k=>`<i class="${k<g?"done":k===g?"on":""}"></i>`).join("")}

  $("#dockIns").href=insHref();$("#dockIns").textContent="📞 "+(my.insurer||"내 보험사");
  if(S.screen==="photos"){aiLine();loadModel()}
}
function insHref(){return my.phone?"tel:"+my.phone.replace(/[^0-9+]/g,""):"#"}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmt(d){return new Date(d).toLocaleString("ko-KR",{month:"long",day:"numeric",weekday:"short",hour:"2-digit",minute:"2-digit"})}
function locText(){if(S.loc)return `${S.loc.lat.toFixed(5)}, ${S.loc.lng.toFixed(5)} (±${Math.round(S.loc.acc)}m) · <a href="https://map.kakao.com/link/map/사고위치,${S.loc.lat},${S.loc.lng}" target="_blank" rel="noopener">지도</a>`;return S.locErr?"위치 권한이 없어 기록하지 못했어요":"위치를 찾는 중이에요"}
function getLoc(cb){if(!navigator.geolocation){S.locErr=true;return}navigator.geolocation.getCurrentPosition(p=>{S.loc={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};S.locErr=false;const t=$("#locTxt");if(t)t.innerHTML=locText();cb&&cb()},()=>{S.locErr=true;const t=$("#locTxt");if(t)t.innerHTML=locText()},{enableHighAccuracy:true,timeout:10000})}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2200)}
function tick(){if(!S.started)return;const s=Math.floor((Date.now()-S.started)/1000);$("#timer").textContent=`사고 후 ${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`}
setInterval(tick,1000);
function reportText(){

  return `[사고내비 사고 기록]\n시각: ${S.started?fmt(S.started):"-"}\n위치: ${S.loc?`https://map.kakao.com/link/map/사고위치,${S.loc.lat},${S.loc.lng}`:"미기록"}\n유형: ${T}\n부상자: ${{yes:"있음",unknown:"확인 필요",no:"없음"}[S.injured]||"-"}\n상대방: ${[S.other.name,S.other.phone,S.other.plate,S.other.insurer].filter(Boolean).join(" / ")||"미기록"}\n사진: ${buildShots().filter(s=>S.photos[s.id]).map(s=>s.t).join(", ")||"없음"}\n메모: ${S.memo||"-"}`;

/* ---------- 이벤트 ---------- */
$("#back").addEventListener("click",back);
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("#lb")){$("#lb").hidden=true;return}
  const z=t.closest("[data-zoom]");if(z&&S.photos[z.dataset.zoom]){$("#lbImg").src=S.photos[z.dataset.zoom].url;$("#lb").hidden=false;return}
  if(t.id==="sheet"){closeSheet();return}
  if(t.closest('a[href="#"]')){e.preventDefault();sheetIns();return}
  let el;
  if(el=t.closest("[data-inj]")){S.injured=el.dataset.inj;go(S.injured==="no"?"place":"call119");return}
  if(el=t.closest("[data-place]")){S.place=el.dataset.place;go(S.place==="highway"?"bitbox":"type");return}
  if(el=t.closest("[data-type]")){S.type=el.dataset.type;S.role=null;S.extra=[];S.pi=0;S.ai=0;go(S.type==="car"||S.type==="person"?"role":"actions");return}
  if(el=t.closest("[data-role]")){S.role=el.dataset.role;S.ai=0;go("actions");return}
  if(el=t.closest("[data-go]")){go(el.dataset.go);return}
  if(!(el=t.closest("[data-a]")))return;
  const A=buildActions();
  switch(el.dataset.a){
    case "start":start(false);break;
    case "demo":start(true);break;
    case "insSheet":sheetIns();break;
    case "close":closeSheet();break;
    case "saveIns":my={insurer:$("#myIns").value.trim(),phone:$("#myPhone").value.trim()};store.set("sagonavi_my",my);closeSheet();toast("저장했어요");render();break;
    case "actDone":S.done.add(A[Math.min(S.ai,A.length-1)].id);/* falls through */
    case "actSkip":if(S.ai<A.length-1){S.hist.push({screen:"actions",ai:S.ai,pi:S.pi});S.ai++;render()}else{S.pi=0;go("photos")}break;
    case "shotNext":{const L=buildShots();if(S.pi<L.length-1){S.hist.push({screen:"photos",ai:S.ai,pi:S.pi});S.pi++;render()}else go("info");break}
    case "loc":toast("위치를 찾는 중…");getLoc(()=>toast("위치를 기록했어요"));break;
    case "f12":sheetF12();break;
    case "next3":sheetNext3();break;
    case "share":{const txt=reportText();if(navigator.share)navigator.share({title:"사고 기록",text:txt}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast("리포트를 복사했어요"));break}
    case "print":window.print();break;
    case "reset":if(confirm("사고 기록을 모두 지울까요?")){Object.assign(S,{screen:"home",hist:[],started:null,injured:null,place:null,type:null,role:null,ai:0,pi:0,done:new Set(),photos:{},extra:[],other:{name:"",phone:"",plate:"",insurer:""},memo:"",loc:null,locErr:false,fault12:new Set()});render()}break;
  }
});
document.addEventListener("input",e=>{if(e.target.dataset.o)S.other[e.target.dataset.o]=e.target.value;if(e.target.id==="memo")S.memo=e.target.value});
document.addEventListener("change",async e=>{
  if(e.target.dataset.f12!=null){const i=+e.target.dataset.f12;e.target.checked?S.fault12.add(i):S.fault12.delete(i);f12();return}
  const id=e.target.dataset.shot;if(!id||!e.target.files||!e.target.files[0])return;
  const file=e.target.files[0];const shot=buildShots().find(s=>s.id===id);
  S.busy=id;render();
  let n=0;while(modelState==="loading"&&n++<150)await new Promise(r=>setTimeout(r,100));
  try{S.photos[id]=await analyze(shot,file)}catch(err){toast("사진을 읽지 못했어요. 다시 시도해 주세요")}
  S.busy=null;render();
});
window.__SN={S,buildActions,buildShots,analyze,render,go,get modelState(){return modelState},loadModel};
render();
})();
</script>
