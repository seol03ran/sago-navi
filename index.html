<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>사고내비 · 교통사고 현장 길잡이</title>
<meta name="description" content="교통사고가 나면 앱을 켜세요. 말로 상황을 설명하면 AI가 정리하고, 지금 할 일과 법적 의무를 한 화면에 하나씩 알려 주며, 사진을 판독해 부족하면 다시 찍도록 안내합니다.">
<meta property="og:title" content="사고내비 · 교통사고 현장 길잡이">
<meta property="og:description" content="사고 직후, 지금 할 일을 하나씩. AI 상황 정리·사진 판독·현장 질문·경위서 초안.">
<meta name="theme-color" content="#16181b">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --paper:#efece4; --card:#fbfaf6; --ink:#16181b; --sub:#5f625f; --line:#d6d1c4; --line2:#bdb7a8;
  --y:#ffc21a; --y-soft:#fff0bf; --red:#cf2e1d; --red-soft:#f8dfd8; --green:#1d7349; --green-soft:#dcecdf;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button,input,textarea{font:inherit;color:inherit}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.app{height:100vh;height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--paper)}
header{flex:none;background:var(--ink);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 12px 0}
.hrow{display:flex;align-items:center;gap:8px;height:36px}
.back{flex:none;width:36px;height:36px;border:1px solid #3a3d42;border-radius:8px;background:none;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.logo{display:flex;align-items:baseline;gap:7px;font-weight:800;font-size:18px;letter-spacing:-.4px}
.logo i{font-style:normal;font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--y);letter-spacing:.6px}
.hright{margin-left:auto;display:flex;gap:6px;align-items:center}
.timer{font-family:var(--mono);font-size:12.5px;color:#d8d8d2;padding:0 2px;white-space:nowrap}
.askbtn{display:flex;align-items:center;gap:5px;height:32px;padding:0 10px;border:none;border-radius:7px;background:var(--y);color:var(--ink);font-weight:800;font-size:13.5px;cursor:pointer;white-space:nowrap}
.askbtn svg.i{width:17px;height:17px}
.prog{display:flex;align-items:center;gap:8px;height:22px;margin-top:6px}
.prog b{font-size:11.5px;font-weight:700;color:var(--y);white-space:nowrap}.prog b i{font-style:normal;font-family:var(--mono);font-weight:600;margin-right:4px}
.bars{display:flex;gap:3px;flex:1}
.bars i{flex:1;height:4px;background:#3a3d42}
.bars i.on{background:var(--y)}.bars i.done{background:#8b8e88}
.hazard{flex:none;height:6px;background:repeating-linear-gradient(-45deg,var(--y) 0 9px,var(--ink) 9px 18px);margin:0 -12px}
header.noprog .hazard{margin-top:8px}
main{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:14px 16px 12px;overflow-y:auto}
.grow{flex:1;min-height:0}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:0;color:var(--sub);display:flex;justify-content:space-between;align-items:center;gap:8px;flex:none;text-transform:uppercase}
.eyebrow.red{color:var(--red)}
h1{font-size:clamp(22px,3.5dvh,27px);line-height:1.28;margin:0;letter-spacing:-.7px;flex:none;font-weight:800}
.lead{color:var(--sub);margin:0;line-height:1.5;font-size:15px;flex:none}
.opts{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;justify-content:flex-end}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line2);border-radius:10px;padding:0 14px;font-size:18px;font-weight:800;cursor:pointer;min-height:clamp(58px,11.5dvh,104px);letter-spacing:-.3px}
.opt .ib{flex:none;width:42px;height:42px;border-radius:8px;background:var(--paper);display:grid;place-items:center}
.opt .ib svg.i{width:24px;height:24px}
.opt .tx{flex:1}
.opt small{display:block;font-weight:500;font-size:13.5px;color:var(--sub);margin-top:2px;letter-spacing:0}
.opt .ch{flex:none;color:var(--line2)}
.opt:active{border-color:var(--ink);background:#fff}
.opt.red .ib{background:var(--red);color:#fff}
.opt.ai{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--y)}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;border:none;border-radius:10px;background:var(--ink);color:#fff;font-weight:800;font-size:17.5px;min-height:56px;padding:0 14px;cursor:pointer;text-decoration:none;text-align:center;letter-spacing:-.3px}
.btn.y{background:var(--y);color:var(--ink)}
.btn.red{background:var(--red)}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line2);font-size:16px;min-height:48px;font-weight:700}
.btn.link{background:none;color:var(--sub);font-size:14.5px;font-weight:600;min-height:34px;text-decoration:underline;text-underline-offset:3px}
.btn:disabled{opacity:.45}
.btns{display:flex;flex-direction:column;gap:8px;flex:none}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.row4 button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:56px;border:1.5px solid var(--line2);background:var(--card);border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;padding:4px 2px}
.row4 button:first-child{background:var(--ink);color:#fff;border-color:var(--ink)}
.sos{flex:1;min-height:150px;max-height:min(340px,42dvh);border:none;border-radius:12px;background:var(--red);color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:18px 20px;text-align:left;position:relative;overflow:hidden}
.sos:after{content:"";position:absolute;right:0;top:0;bottom:0;width:14px;background:repeating-linear-gradient(-45deg,#fff 0 7px,transparent 7px 14px);opacity:.25}
.sos .k{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.8px;opacity:.85}
.sos .t{font-size:clamp(28px,4.6dvh,36px);font-weight:900;letter-spacing:-1px;line-height:1.15}
.sos .s{font-size:14px;font-weight:600;opacity:.92}
.mini{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;font-size:14.5px;cursor:pointer;width:100%;text-align:left;flex:none}
.mini b{margin-left:auto;font-size:14px;flex:none;text-decoration:underline;text-underline-offset:3px}
.muted{color:var(--sub);font-size:12.5px;line-height:1.5;margin:0;flex:none}
.task{flex:1;min-height:0;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px;position:relative}
.tag{align-self:flex-start;font-size:12.5px;font-weight:800;letter-spacing:0;padding:4px 8px;border-radius:4px;border:1.5px solid var(--ink);display:flex;align-items:center;gap:5px}
.tag svg.i{width:14px;height:14px}
.tag.duty{background:var(--red);border-color:var(--red);color:#fff}.tag.safety{background:var(--y);border-color:var(--y)}
.tag.tip{background:none}.tag.warn{background:var(--ink);color:#fff}
.task h2{font-size:clamp(22px,3.8dvh,28px);line-height:1.3;margin:0;letter-spacing:-.6px;font-weight:800}
.task p{margin:0;font-size:clamp(15px,2.6dvh,17.5px);line-height:1.55;color:#2d302e}
.task .mid{margin:auto 0;display:flex;flex-direction:column;gap:10px}
.law{font-size:13px;line-height:1.5;color:#3b3e3b;border-top:1.5px dashed var(--line2);padding-top:10px}
.law b{color:var(--ink)}
.count{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink)}
.dots{display:flex;gap:3px;align-items:center}.dots i{width:12px;height:4px;background:var(--line)}.dots i.d{background:var(--ink)}.dots i.c{background:var(--y);width:20px}
.steps4{flex:1;display:flex;flex-direction:column;gap:6px;justify-content:center;min-height:0}
.s4{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:6px 14px;min-height:clamp(54px,10dvh,90px);font-size:18px;font-weight:800}
.s4 .n{flex:none;width:34px;height:34px;border-radius:6px;background:var(--ink);color:var(--y);display:grid;place-items:center;font-family:var(--mono);font-size:16px}
.s4 small{display:block;font-size:13px;font-weight:500;color:var(--sub)}
.bigalert{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:12px;background:var(--red);color:#fff;border-radius:12px;padding:22px}
.bigalert .k{font-family:var(--mono);font-size:12px;letter-spacing:.8px;opacity:.85}
.bigalert h2{margin:0;font-size:clamp(26px,4.4dvh,32px);letter-spacing:-.8px;line-height:1.2}
.bigalert p{margin:0;font-size:16.5px;line-height:1.6}
.bigalert .sm{font-size:14px;opacity:.9}
.shot{flex:1;min-height:0;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.shot.extra{border:2px dashed var(--ink)}
.shead{display:flex;gap:12px;align-items:center;flex:none}
.shead .ic{flex:none;width:46px;height:46px;border-radius:8px;background:var(--y);display:grid;place-items:center}
.shead .ic svg.i{width:24px;height:24px}
.shead h2{font-size:19px;margin:0;line-height:1.3;letter-spacing:-.4px}
.shead p{margin:2px 0 0;font-size:14px;color:var(--sub);line-height:1.4}
.cam{flex:1;min-height:110px;border:2px dashed var(--line2);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;background:var(--paper);font-weight:800;font-size:19px;text-align:center;padding:10px}
.cam svg.i{width:40px;height:40px;stroke-width:1.6}
.cam small{font-weight:500;font-size:13px;color:var(--sub)}
input[type=file]{display:none}
.prev{flex:1;min-height:80px;position:relative;border-radius:8px;overflow:hidden;background:#111;cursor:zoom-in}
.prev img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.verdict{border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.45;flex:none;border-left:5px solid}
.verdict.ok{background:var(--green-soft);border-color:var(--green)}.verdict.warn{background:var(--y-soft);border-color:var(--y)}.verdict.retry{background:var(--red-soft);border-color:var(--red)}
.verdict .vh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px}
.verdict .vh b{font-size:15.5px}
.verdict .tags{font-size:12px;color:#4b4e4b;margin-top:4px;line-height:1.4}
.src{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.4px;background:var(--ink);color:var(--y);padding:2px 6px;border-radius:3px;white-space:nowrap;flex:none}
.src.dev{background:none;color:var(--sub);border:1px solid var(--line2)}
.ailine{font-size:12px;color:var(--sub);flex:none;min-height:16px;display:flex;align-items:center;gap:6px}
.spin{display:inline-block;width:15px;height:15px;border:2.5px solid var(--line2);border-top-color:var(--ink);border-radius:50%;animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.field{flex:none}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:4px;color:#3b3e3b}
.field input{width:100%;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card)}
.field input.filled{border-color:var(--ink);background:var(--y-soft)}
.hline{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex:none}
.chipbtn{flex:none;display:flex;align-items:center;gap:5px;border:1.5px solid var(--ink);background:var(--card);border-radius:8px;padding:7px 10px;font-weight:800;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chipbtn svg.i{width:17px;height:17px}
.locline{font-size:13.5px;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;line-height:1.55;flex:none}
.locline .m{font-family:var(--mono);font-size:12px}
.calls{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:none}
.call{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;text-decoration:none;color:var(--ink);background:var(--card);border:1.5px solid var(--line2);border-radius:10px;min-height:clamp(60px,9.5dvh,80px);font-weight:800;font-size:17px;padding:0 14px;cursor:pointer}
.call small{font-weight:500;font-size:12px;color:var(--sub);font-family:var(--mono)}
.call.r{background:var(--red);color:#fff;border-color:var(--red)}.call.r small{color:#ffd9d2}
.call.n{background:var(--ink);color:#fff;border-color:var(--ink)}.call.n small{color:#bdbdb5}
.note{border-radius:8px;padding:11px 13px;font-size:14.5px;line-height:1.5;flex:none;border-left:5px solid}
.note b{display:block;font-size:15.5px;margin-bottom:2px}
.note.red{background:var(--red-soft);border-color:var(--red)}.note.blue{background:#e6e8ea;border-color:var(--ink)}.note.amber{background:var(--y-soft);border-color:var(--y)}.note.green{background:var(--green-soft);border-color:var(--green)}.note.gray{background:#e6e4dd;border-color:var(--line2)}
.list{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:0;flex:none;border-top:1.5px solid var(--line)}
.list li{border-bottom:1.5px solid var(--line);padding:9px 2px;font-size:14.5px;line-height:1.4;display:flex;gap:10px;align-items:center}
.list li .n{flex:none;font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--sub)}
.rep{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:2px 14px;flex:none}
.rep div{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.4}
.rep div:last-child{border:none}
.rep span{flex:none;width:40px;color:var(--sub);font-size:12.5px;font-weight:700;padding-top:1px}
.thumbs{display:flex;gap:6px;overflow-x:auto;flex:none}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:6px;flex:none;cursor:zoom-in}
.dock{flex:none;background:var(--ink);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:6px}
.dock a{display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-weight:800;border-radius:8px;min-height:46px;font-size:15.5px;white-space:nowrap;overflow:hidden;font-family:var(--mono);letter-spacing:-.2px}
.dock a span{font-family:Pretendard,sans-serif;font-size:12.5px;font-weight:600;opacity:.85}
.dock a svg.i{width:17px;height:17px}
.dock .d1{background:var(--red);color:#fff}.dock .d2{background:#2c2f33;color:#fff}.dock .d3{background:var(--y);color:var(--ink);font-family:Pretendard,sans-serif;font-size:14.5px}
.sheetbg{position:fixed;inset:0;z-index:50;background:rgba(14,15,16,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:90dvh;overflow-y:auto;background:var(--paper);border-radius:14px 14px 0 0;padding:0 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.sheet:before{content:"";display:block;height:6px;margin:0 -16px 6px;background:repeating-linear-gradient(-45deg,var(--y) 0 9px,var(--ink) 9px 18px);border-radius:14px 14px 0 0;flex:none}
.sheet h2{margin:0;font-size:20px;letter-spacing:-.4px;display:flex;align-items:center;gap:8px}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;padding:7px 2px;border-bottom:1px solid var(--line)}
.chk input{width:20px;height:20px;accent-color:var(--red);flex:none}
textarea.talk{width:100%;min-height:96px;resize:none;border:1.5px solid var(--line2);border-radius:10px;background:var(--card);padding:12px;font-size:16px;line-height:1.5}
.talkrow{display:flex;gap:8px}
.mic{flex:none;width:56px;border:none;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;cursor:pointer}
.mic.on{background:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.7}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1.5px solid var(--line2);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13.5px;cursor:pointer;text-align:left}
.ans{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.55}
.ans .q{font-size:13px;color:var(--sub);margin-bottom:4px}
.ans .lw{font-family:var(--mono);font-size:11.5px;color:var(--sub);margin-top:6px}
.ans a.btn{margin-top:8px;min-height:44px;font-size:15.5px}
.understood{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;background:var(--card);border:1.5px solid var(--ink);border-radius:10px;padding:12px 14px;font-size:15px}
.understood span{color:var(--sub);font-size:13px;font-weight:700;padding-top:1px}
.understood .q{color:var(--red);font-weight:700}
.doc{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14.5px;line-height:1.65;white-space:pre-wrap}
.doc h3{margin:0 0 6px;font-size:13px;font-family:var(--mono);letter-spacing:.4px;color:var(--sub);font-weight:600}
.lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:8px;color:#fff;font-size:13px}
.lb img{max-width:100%;max-height:85dvh;border-radius:6px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:70;max-width:90%;text-align:center;border-left:4px solid var(--y)}
.toast.on{opacity:1}
.relocate{border:1px solid var(--line2);background:var(--paper);border-radius:6px;font-size:12px;padding:2px 8px;margin-left:4px;cursor:pointer}
@media (max-height:690px){main{padding-top:10px;gap:8px}.h7{display:none}.rep div{font-size:13.5px}.rep{padding:0 12px}.thumbs img{width:48px!important;height:48px!important}.row4 button{min-height:50px}.task{padding:14px;gap:8px}.task p{font-size:15px}.law{font-size:12.5px;padding-top:8px}.btn{min-height:50px}.btn.ghost{min-height:44px}.dock a{min-height:42px}.list li{padding:7px 2px;font-size:14px}.rep div{padding:5px 0}.thumbs img{width:56px;height:56px}.call{min-height:56px}.note b{margin-bottom:0}.note{padding:9px 12px;font-size:14px}}
@media (max-height:600px){main{gap:6px;padding:8px 14px 8px}.eyebrow.hs{display:none}h1{font-size:19.5px}.lead{font-size:14px}
 .field label{font-size:12px;margin-bottom:2px}.field input{padding:8px 10px;font-size:15px}.locline{padding:7px 10px;font-size:12.5px}
 .call{min-height:50px;font-size:15.5px}.note{padding:7px 10px;font-size:13px}.note b{font-size:14px}.list li{padding:5px 2px;font-size:13px}
 .rep div{padding:4px 0;font-size:13px}.thumbs img{width:44px;height:44px}.btn{min-height:46px;font-size:16.5px}.btn.ghost{min-height:42px;font-size:15px}

async function gpt(task,data,ms){
  const c=new AbortController();const t=setTimeout(()=>c.abort(),ms||20000);
  try{const r=await fetch(AI_URL,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(Object.assign({task},data)),signal:c.signal});
    const j=await r.json();if(!j.ok)throw new Error(j.error||"fail");gptState="ready";return j.result}
  finally{clearTimeout(t)}
}

  if(model||modelState==="loading")return;modelState="loading";aiLine();
  const wait=()=>new Promise((res,rej)=>{let n=0;const t=setInterval(()=>{if(window.cocoSsd&&window.tf){clearInterval(t);res()}else if(++n>200){clearInterval(t);rej()}},100)});
  wait().then(()=>cocoSsd.load({base:"lite_mobilenet_v2"})).then(m=>{model=m;modelState="ready";aiLine()}).catch(()=>{modelState="fail";aiLine()});
}
function aiLine(){const el=$("#aiLine");if(!el)return;
  const dev={idle:"",loading:'<span class="spin"></span>기기 AI 준비 중',ready:"기기 AI 준비됨",fail:"기기 AI 없음 · 흔들림·밝기만 검사"}[modelState];
  const g=gptState==="ready"?" · GPT 판독 켜짐(축소 사진 전송, 저장 안 함)":gptState==="off"?" · GPT 연결 안 됨":"";
  el.innerHTML=dev+g}
const VEH=["car","truck","bus","motorcycle"];
const KO={car:"승용차",truck:"트럭",bus:"버스",motorcycle:"오토바이",bicycle:"자전거",person:"사람","traffic light":"신호등","stop sign":"정지 표지판"};
function fileToImage(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f);const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=u})}
function downscale(img,max){const w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;const r=Math.min(1,max/Math.max(w,h));const c=document.createElement("canvas");c.width=Math.round(w*r);c.height=Math.round(h*r);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return c}
function quality(c){
  const w=480,h=Math.max(1,Math.round(c.height*480/c.width));const t=document.createElement("canvas");t.width=w;t.height=h;const g=t.getContext("2d");g.drawImage(c,0,0,w,h);
  const d=g.getImageData(0,0,w,h).data;const gr=new Float32Array(w*h);let sum=0;
  for(let i=0;i<w*h;i++){const v=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];gr[i]=v;sum+=v}
  let ls=0,ls2=0,n=0;for(let y=1;y<h-1;y++)for(let x=1;x<w-1;x++){const i=y*w+x;const v=4*gr[i]-gr[i-1]-gr[i+1]-gr[i-w]-gr[i+w];ls+=v;ls2+=v*v;n++}
  return {bright:sum/(w*h),sharp:ls2/n-(ls/n)**2};
}
async function analyze(shot,file){
  const img=await fileToImage(file);const c=downscale(img,1024);const q=quality(c);let dets=[];
  if(model){try{dets=await model.detect(c,20,0.4)}catch(e){}}
  const A=c.width*c.height;
  const objs=dets.map(d=>({cls:d.class,score:d.score,box:d.bbox,area:d.bbox[2]*d.bbox[3]/A}));
  const veh=objs.filter(o=>VEH.includes(o.cls));const maxV=veh.reduce((m,o)=>Math.max(m,o.area),0);
  const sig=objs.filter(o=>o.cls==="traffic light"||o.cls==="stop sign");
  const ppl=objs.filter(o=>["person","bicycle","motorcycle"].includes(o.cls));
  let st="ok",msg=[],blur=false;
  const warn=m=>{if(st==="ok")st="warn";msg.push(m)};
  if(q.sharp<60){st="retry";blur=true;msg.push("사진이 흔들렸어요. 두 손으로 잡고 다시 찍어 주세요.")}
  if(q.bright<45)warn("너무 어두워요. 플래시를 켜고 한 장 더 찍어 두면 좋아요.");
  if(model&&st!=="retry"){
    const k=shot.kind;
    if(k==="wide2"||k==="wide1"){
      if(!veh.length){st="retry";msg.push("차가 보이지 않아요. 차가 화면 안에 들어오게 다시 찍어 주세요.")}
      else if(maxV>0.5){st="retry";msg.push("너무 가까워요. 3~5걸음 물러나서 차 전체와 차선이 나오게 찍어 주세요.")}
      else if(k==="wide2"&&veh.length<2){warn("차가 1대만 보여요. 상대 차도 나오게 다른 각도에서 1장 더 찍어 주세요.");addExtra(shot.parent||shot.id,{id:(shot.parent||shot.id)+"_b",ic:"cam",t:"두 차가 함께 나온 다른 각도",d:"옆이나 대각선에서 두 차가 다 나오게",kind:"wide2"})}
    } else if(k==="close"){ if(veh.length&&maxV<0.2)warn("파손 부위가 작게 나왔어요. 한두 걸음 다가가서 크게 찍어 주세요."); }
    else if(k==="signal"){ if(!sig.length)warn("신호등·표지판을 찾지 못했어요. 있다면 함께 나오게 다시 찍고, 없으면 넘어가도 돼요."); }
    else if(k==="person"){ if(!ppl.length&&!veh.length)warn("위치를 알 만한 표시가 잘 안 보여요. 차와 함께 나오게 찍어 주세요."); }
    else if(k==="plate"){ if(q.sharp<300)warn("번호 글자가 흐릴 수 있어요. 가까이에서 초점을 맞춰 한 장 더 찍어 주세요."); }
  }
  if(st==="ok")msg.unshift({wide2:"두 차의 위치가 잘 보여요.",wide1:"전체 상황이 잘 보여요.",close:"파손 부위가 잘 보여요.",plate:"번호판 글자가 읽히는지 한 번만 확인해 주세요.",signal:"신호·표지가 함께 찍혔어요.",person:"위치가 기록됐어요.",any:"기록됐어요."}[shot.kind]||"좋아요.");
  const send=downscale(c,shot.kind==="plate"?1024:768).toDataURL("image/jpeg",.72);
  const out=document.createElement("canvas");out.width=c.width;out.height=c.height;const g=out.getContext("2d");g.drawImage(c,0,0);
  const fs=Math.max(16,c.width/30);g.lineWidth=Math.max(3,c.width/200);g.font=`bold ${fs}px sans-serif`;
  for(const o of objs){const col=VEH.includes(o.cls)?"#ffc21a":o.cls==="person"?"#ff6a4d":"#7fd1ae";g.strokeStyle=col;g.strokeRect(o.box[0],o.box[1],o.box[2],o.box[3]);const lab=(KO[o.cls]||o.cls)+" "+Math.round(o.score*100)+"%";const tw=g.measureText(lab).width+10;const lh=fs+8;g.fillStyle=col;g.fillRect(o.box[0],Math.max(0,o.box[1]-lh),tw,lh);g.fillStyle="#16181b";g.fillText(lab,o.box[0]+5,Math.max(fs,o.box[1]-6))}
  const cnt={};objs.forEach(o=>{const k=KO[o.cls]||o.cls;cnt[k]=(cnt[k]||0)+1});
  return {status:st,msg,tags:Object.entries(cnt).map(([k,v])=>k+" "+v),q,blur,url:out.toDataURL("image/jpeg",.72),send};
}
function addExtra(parent,e){if(S.extra.some(x=>x.id===e.id))return;S.extra.push(Object.assign({parent,opt:false,isExtra:true},e));toast("AI가 사진 1장을 더 요청했어요")}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null;
function micToggle(btn,ta){
  if(!SR){toast("이 브라우저는 음성 입력을 지원하지 않아요. 키보드의 마이크 버튼을 써 주세요");return}

  rec=new SR();rec.lang="ko-KR";rec.interimResults=true;rec.continuous=true;

  rec.onresult=e=>{let s="";for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;ta.value=base+s};

function localTriage(t){
  const has=(...w)=>w.some(x=>t.includes(x));
  const r={injured:"unknown",place:"unknown",type:"unknown",role:"unknown",summary:"",first:""};
  if(has("안 다쳤","다친 사람 없","다친 사람은 없","멀쩡"))r.injured="no";else if(has("다쳤","피가","피 나","아파","의식","쓰러"))r.injured="yes";
  if(has("고속도로","자동차전용","톨게이트","휴게소"))r.place="highway";else if(has("주차","골목","아파트","단지"))r.place="parking";else if(has("도로","교차로","신호","횡단보도","사거리"))r.place="road";
  if(has("보행자","사람을","사람이랑","자전거","킥보드"))r.type="person";else if(has("주차된","세워진","세워 둔","차 주인"))r.type="parked";else if(has("가드레일","전봇대","혼자","포트홀","벽에"))r.type="single";else if(has("차","박았","받았","추돌"))r.type="car";
  if(has("뒤차가","받혔","박혔","저를 박"))r.role="gothit";else if(has("제가 박","내가 박","들이받","앞차를"))r.role="hit";
  r.summary="(기본 분석) 말한 내용에서 단어로 골랐어요";r.first=r.injured!=="no"?"다친 사람이 있으면 119에 먼저 전화하세요.":r.place==="highway"?"가드레일 밖으로 대피하세요.":"비상등을 켜고 안전을 확인하세요.";
  return r;
}

/* 다음 화면: AI가 채운 답은 건너뜀 */
function nextScreen(cur){
  const seq=["injured","call119","place","bitbox","type","role","actions"];
  for(let i=seq.indexOf(cur)+1;i<seq.length;i++){const s=seq[i];
    if(s==="call119"&&S.injured==="no")continue;
    if(s==="bitbox"&&S.place!=="highway")continue;
    if(s==="role"&&!(S.type==="car"||S.type==="person"))continue;
    if(S.auto&&((s==="place"&&S.place)||(s==="type"&&S.type)||(s==="role"&&S.role)))continue;
    return s}
  return "actions";
}

  const phone=(t.match(/01[016789][-\s]?\d{3,4}[-\s]?\d{4}/)||[""])[0].replace(/\s/g,"-");
  const plate=(t.match(/\d{2,3}\s?[가-힣]\s?\d{4}/)||[""])[0].replace(/\s/g,"");
  const ins=(t.match(/[가-힣A-Za-z]+(화재|손해보험|손보|보험|해상|다이렉트)/)||[""])[0];
  return {name:"",phone,plate,insurer:ins,memo:""};
}

  return reportText()+`\n장소 구분: ${PNAME[S.place]||"-"}\n누가: ${RNAME[S.role]||"-"}\nAI가 이해한 상황: ${S.aiSummary||"-"}\n완료한 조치: ${A.filter(a=>S.done.has(a.id)).map(a=>a.title).join(", ")||"없음"}\n사진 판독: ${L.map(s=>{const g=S.photos[s.id].gpt;return s.t+" — "+(g&&g.seen?g.seen:S.photos[s.id].tags.join(", ")||"기록")}).join(" / ")||"없음"}`;
}
async function sheetDoc(){
  openSheet(`<h2>${ic("doc")}AI 사고 경위서 초안</h2><div id="docBox"><div class="ailine"><span class="spin"></span>기록한 내용으로 경위서를 쓰는 중</div></div><button class="btn ghost" data-a="close">닫기</button>`);
  let r;
  try{r=await gpt("report",{record:recordText()},28000)}
  catch(e){$("#docBox").innerHTML='<div class="note amber"><b>AI에 연결하지 못했어요</b>아래 ‘공유’로 사고 기록을 보내고, 경위서는 보험사 안내에 따라 작성하세요.</div>';return}

  $("#docBox").innerHTML=`<div class="doc"><h3>사고 경위서 (초안)</h3>${esc(r.statement)}</div>
  <div class="doc"><h3>보험사 접수 문자</h3>${esc(r.sms)}</div>
  ${r.missing&&r.missing.length?`<div class="note amber"><b>지금 챙기면 좋은 것</b>${r.missing.map(esc).join(" · ")}</div>`:""}

}

R.photos=()=>{
  const L=buildShots();const i=Math.min(S.pi,L.length-1);const s=L[i];const p=S.photos[s.id];
  const need=L.filter(x=>!x.opt);const okN=need.filter(x=>S.photos[x.id]&&S.photos[x.id].status!=="retry").length;
  const last=i===L.length-1;
  const lab={ok:"좋아요",warn:"확인해 주세요",retry:"다시 찍어 주세요"};
  const nextLabel=last?"다음: 정보 기록":"다음 사진";
  let body,btns;
  if(S.busy===s.id){
    body=`<div class="cam" style="cursor:default"><span class="spin" style="width:34px;height:34px;border-width:4px"></span>기기 AI가 사진을 보는 중</div>`;btns="";

    const srcTag=g?'<span class="src">GPT 판독</span>':p.gpt==="busy"?'<span class="src dev" style="display:flex;gap:5px;align-items:center"><span class="spin" style="width:10px;height:10px;border-width:2px"></span>GPT 판독 중</span>':'<span class="src dev">기기 AI</span>';
    body=`<div class="prev" data-zoom="${s.id}"><img src="${p.url}" alt="AI 분석 결과"></div>
    <div class="verdict ${p.status}"><div class="vh"><b>${lab[p.status]}</b>${srcTag}</div>${text}<div class="tags">${g&&g.seen?"판독: "+esc(g.seen)+" · ":""}기기 인식: ${p.tags.join(", ")||"없음"}${g&&g.plate?" · 번호 "+esc(g.plate):""}</div></div>`;
    btns=p.status==="retry"
      ?`<label class="btn red">${ic("cam")}다시 찍기<input type="file" accept="image/*" capture="environment" data-shot="${s.id}"></label><button class="btn ghost" data-a="shotNext">그래도 ${nextLabel}</button>`
      :`<button class="btn" data-a="shotNext">${nextLabel}</button><label class="btn ghost">${ic("cam")}다시 찍기<input type="file" accept="image/*" capture="environment" data-shot="${s.id}"></label>`;
  } else {
    body=`<label class="cam">${ic("cam")}촬영하기<small>${s.d}</small><input type="file" accept="image/*" capture="environment" data-shot="${s.id}"></label>`;
    btns=`<div class="row2"><label class="btn ghost">${ic("img")}앨범에서<input type="file" accept="image/*" data-shot="${s.id}"></label><button class="btn ghost" data-a="shotNext">${s.opt?"없어요 · 건너뛰기":"건너뛰기"}</button></div>`;
  }
  return `<div class="eyebrow"><span class="count">사진 ${String(i+1).padStart(2,"0")}/${String(L.length).padStart(2,"0")} · ${s.isExtra?"AI 추가 요청":s.opt?"선택":"필수"}</span><span>필수 ${okN}/${need.length}</span></div>

};

  <div>${FAULT12.map((f,i)=>`<label class="chk"><input type="checkbox" data-f12="${i}" ${S.fault12.has(i)?"checked":""}>${f}</label>`).join("")}</div>
  <div id="f12res"></div><button class="btn ghost" data-a="close">닫기</button>`);f12()}
function f12(){const el=$("#f12res");if(!el)return;el.innerHTML=S.fault12.size?`<div class="note red"><b>보험과 별개로 형사처벌될 수 있어요</b>진술은 사실대로 하고, 조사 전에 대한법률구조공단(☎132)이나 변호사와 상담하세요. 피해자와 합의하면 양형에 반영될 수 있어요.</div>`:`<div class="note green"><b>해당하는 게 없다면</b>종합보험에 가입돼 있고 피해자가 중상해가 아니면 공소가 제기되지 않아요(교통사고처리특례법 제4조 제1항).</div>`}
function sheetNext3(){openSheet(`<h2>${ic("list")}앞으로 할 일</h2>
  <div class="note blue"><b>보험·민사</b>보험사 접수번호를 받아 두세요. 과실비율은 손해보험협회 과실비율 인정기준에 따라 정해지고, 보험사끼리 다투면 구상금분쟁심의위원회가 심의해요.</div>
  ${S.injured!=="no"?`<div class="note amber"><b>형사</b>사람이 다친 사고는 경찰 조사를 받아요. 종합보험 가입과 12대 중과실 해당 여부에 따라 처벌이 갈려요(교통사고처리특례법 제3조·제4조). 무료 상담: 대한법률구조공단 ☎132</div>
  <div class="note gray"><b>행정</b>사람이 다친 사고는 피해 정도에 따라 운전면허 벌점이 매겨질 수 있어요.</div>`:""}
  ${S.type==="single"?`<div class="note green"><b>도로 결함</b>도로 관리 잘못이 원인이면 도로관리청에 배상을 청구할 수 있어요(국가배상법 제5조).</div>`:""}
  <div class="note green"><b>진료</b>아프면 바로 진료받고 진단서·영수증을 모아 두세요.</div>
  <button class="btn ghost" data-a="close">닫기</button>`)}

/* ---------- 공통 ---------- */
function render(){
  view.innerHTML=R[S.screen]();view.scrollTop=0;
  const g=GROUP[S.screen];const prog=$("#prog");
  if(g==null){prog.hidden=true;$("#hdr").classList.add("noprog")}else{prog.hidden=false;$("#hdr").classList.remove("noprog");$("#progTxt").innerHTML=`<i>${String(g+1).padStart(2,"0")}/07</i>${GNAME[g]}`;$("#bars").innerHTML=[0,1,2,3,4,5,6].map(k=>`<i class="${k<g?"done":k===g?"on":""}"></i>`).join("")}
  $("#back").hidden=!S.hist.length||S.screen==="home";
  $("#timer").hidden=!S.started;tick();
  $("#dockIns").href=insHref();$("#dockIns").textContent=my.insurer||"내 보험사";
  if(S.screen==="photos"){aiLine();loadModel()}
}
function insHref(){return my.phone?"tel:"+my.phone.replace(/[^0-9+]/g,""):"#"}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function fmt(d){return new Date(d).toLocaleString("ko-KR",{month:"long",day:"numeric",weekday:"short",hour:"2-digit",minute:"2-digit"})}
function locText(){if(S.loc)return `<span class="m">${S.loc.lat.toFixed(5)}, ${S.loc.lng.toFixed(5)} ±${Math.round(S.loc.acc)}m</span> · <a href="https://map.kakao.com/link/map/사고위치,${S.loc.lat},${S.loc.lng}" target="_blank" rel="noopener">지도</a>`;return S.locErr?"위치 권한이 없어 기록하지 못했어요":"위치를 찾는 중이에요"}
function getLoc(cb){if(!navigator.geolocation){S.locErr=true;return}navigator.geolocation.getCurrentPosition(p=>{S.loc={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};S.locErr=false;const t=$("#locTxt");if(t)t.innerHTML=locText();cb&&cb()},()=>{S.locErr=true;const t=$("#locTxt");if(t)t.innerHTML=locText()},{enableHighAccuracy:true,timeout:10000})}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),2600)}
function tick(){if(!S.started)return;const s=Math.floor((Date.now()-S.started)/1000);$("#timer").textContent=`+${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`}
setInterval(tick,1000);
function reportText(){
  return `[사고내비 사고 기록]\n시각: ${S.started?fmt(S.started):"-"}\n위치: ${S.loc?`https://map.kakao.com/link/map/사고위치,${S.loc.lat},${S.loc.lng}`:"미기록"}\n유형: ${TNAME[S.type]||"-"}\n부상자: ${INAME[S.injured]||"-"}\n상대방: ${[S.other.name,S.other.phone,S.other.plate,S.other.insurer].filter(Boolean).join(" / ")||"미기록"}\n사진: ${buildShots().filter(s=>S.photos[s.id]).map(s=>s.t).join(", ")||"없음"}\n메모: ${S.memo||"-"}`;
}
function start(demo){S.started=Date.now();S.demo=demo;S.auto=false;S.hist=[];loadModel();getLoc();if(demo)toast("체험 모드 · 아무 차 사진으로 AI 판독을 써 보세요");go("injured")}
function shareText(txt,title){if(navigator.share)navigator.share({title,text:txt}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>toast("복사했어요"))}

/* ---------- 이벤트 ---------- */
$("#back").addEventListener("click",back);
document.addEventListener("click",e=>{
  const t=e.target;
  if(t.closest("#lb")){$("#lb").hidden=true;return}
  const z=t.closest("[data-zoom]");if(z&&S.photos[z.dataset.zoom]){$("#lbImg").src=S.photos[z.dataset.zoom].url;$("#lb").hidden=false;return}
  if(t.id==="sheet"){closeSheet();return}
  if(t.closest('a[href="#"]')){e.preventDefault();sheetIns();return}
  let el;
  if(el=t.closest("[data-mic]")){micToggle(el,$("#"+el.dataset.mic));return}
  if(el=t.closest("[data-fill]")){$("#"+el.dataset.fill).value=el.textContent;return}
  if(el=t.closest("[data-askq]")){askGo(el.dataset.askq);return}
  if(el=t.closest("[data-inj]")){S.injured=el.dataset.inj;go(nextScreen("injured"));return}
  if(el=t.closest("[data-place]")){S.place=el.dataset.place;go(nextScreen("place"));return}
  if(el=t.closest("[data-type]")){S.type=el.dataset.type;S.role=null;S.extra=[];S.pi=0;S.ai=0;go(nextScreen("type"));return}
  if(el=t.closest("[data-role]")){S.role=el.dataset.role;S.ai=0;go("actions");return}
  if(el=t.closest("[data-go]")){go(el.dataset.go);return}
  if(!(el=t.closest("[data-a]")))return;
  const A=buildActions();
  switch(el.dataset.a){
    case "start":start(false);break;
    case "demo":start(true);break;
    case "talk":sheetTalk();break;
    case "talkGo":talkGo();break;
    case "talkStart":talkStart();break;
    case "ask":sheetAsk();break;
    case "askGo":askGo();break;
    case "dictate":sheetDictate();break;
    case "dicGo":dicGo();break;
    case "doc":sheetDoc();break;
    case "docCopy":if(S._doc&&navigator.clipboard)navigator.clipboard.writeText(S._doc.statement).then(()=>toast("경위서를 복사했어요"));break;
    case "smsShare":if(S._doc)shareText(S._doc.sms,"사고 접수");break;
    case "next":go(nextScreen(S.screen));break;
    case "insSheet":sheetIns();break;
    case "close":closeSheet();break;
    case "saveIns":my={insurer:$("#myIns").value.trim(),phone:$("#myPhone").value.trim()};store.set("sagonavi_my",my);closeSheet();toast("저장했어요");render();break;
    case "actDone":S.done.add(A[Math.min(S.ai,A.length-1)].id);/* falls through */
    case "actSkip":if(S.ai<A.length-1){S.hist.push({screen:"actions",ai:S.ai,pi:S.pi});S.ai++;render()}else{S.pi=0;go("photos")}break;
    case "shotNext":{const L=buildShots();if(S.pi<L.length-1){S.hist.push({screen:"photos",ai:S.ai,pi:S.pi});S.pi++;render()}else go("info");break}
    case "loc":toast("위치를 찾는 중…");getLoc(()=>toast("위치를 기록했어요"));break;
    case "f12":sheetF12();break;
    case "next3":sheetNext3();break;
    case "share":shareText(reportText(),"사고 기록");break;
    case "print":window.print();break;
    case "reset":if(confirm("사고 기록을 모두 지울까요?")){Object.assign(S,{screen:"home",hist:[],started:null,injured:null,place:null,type:null,role:null,ai:0,pi:0,done:new Set(),photos:{},extra:[],other:{name:"",phone:"",plate:"",insurer:""},memo:"",loc:null,locErr:false,fault12:new Set(),auto:false,aiSummary:"",qa:[],filled:new Set()});render()}break;
  }
});
document.addEventListener("input",e=>{if(e.target.dataset.o){S.other[e.target.dataset.o]=e.target.value;S.filled.delete(e.target.dataset.o)}if(e.target.id==="memo")S.memo=e.target.value});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="askTxt"&&!e.shiftKey){e.preventDefault();askGo()}});
document.addEventListener("change",async e=>{
  if(e.target.dataset.f12!=null){const i=+e.target.dataset.f12;e.target.checked?S.fault12.add(i):S.fault12.delete(i);f12();return}
  const id=e.target.dataset.shot;if(!id||!e.target.files||!e.target.files[0])return;
  const file=e.target.files[0];const shot=buildShots().find(s=>s.id===id);
  S.busy=id;render();
  let n=0;while(modelState==="loading"&&n++<150)await new Promise(r=>setTimeout(r,100));
  let p=null;try{p=await analyze(shot,file);S.photos[id]=p}catch(err){toast("사진을 읽지 못했어요. 다시 시도해 주세요")}
  S.busy=null;render();
  if(p)gptPhoto(shot,p);
});
window.__SN={S,buildActions,buildShots,analyze,render,go,gpt,gptPhoto,get modelState(){return modelState},get gptState(){return gptState},loadModel,sheetTalk,sheetAsk,sheetDoc,sheetDictate};
gptPing();
render();
})();
</script>
</body>
</html>
